apiVersion: apps/v2
kind: Deployment
metadata:
  name: fee-system-v2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fee-system-v2

  template:
    metadata:
      labels:
        app: fee-system-v2

    spec:
      containers:
      - name: fee-system
        image: swetha1507/fee-system:v2
        ports:
        - containerPort: 3000

---

apiVersion: v2
kind: Service
metadata:
  name: fee-system-v2-service

spec:
  type: NodePort

  selector:
    app: fee-system-v2

  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30002

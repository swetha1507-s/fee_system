apiVersion: apps/v1
kind: Deployment
metadata:
  name: fee-system-v1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fee-system-v1

  template:
    metadata:
      labels:
        app: fee-system-v1

    spec:
      containers:
      - name: fee-system
        image: swetha1507-s/fee-system:v1
        ports:
        - containerPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: fee-system-v1-service

spec:
  type: NodePort

  selector:
    app: fee-system-v1

  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001